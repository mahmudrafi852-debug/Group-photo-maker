<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Group Photo Maker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f2f5f8;color:#18202a}
main{max-width:720px;margin:auto;padding:18px}h1{text-align:center;margin:8px 0 4px;font-size:25px}p.sub{text-align:center;color:#5d6874;margin:0 0 18px}
.panel{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #0000000a}
label.btn,button{display:inline-block;background:#1e293b;color:white;border:0;border-radius:10px;padding:11px 15px;font-weight:650;cursor:pointer;text-align:center}
input[type=file]{max-width:100%}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
canvas{display:block;width:100%;height:auto;background:#e7ebef;border-radius:12px;touch-action:none}
input[type=range]{width:100%;margin:12px 0}small{color:#657181}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#frameInput{display:block;margin:8px 0 14px}.secondary{background:#e9eef4;color:#172333}
</style></head>
<body><main>
<h1>Group Photo Maker</h1><p class="sub">Upload your photo, adjust it, and download your group frame.</p>
<section class="panel">
<strong>১) তোমার ছবি নির্বাচন করো</strong><p><input id="photoInput" type="file" accept="image/*"></p>
<strong>২) গ্রুপের ফ্রেম (PNG) নির্বাচন করো</strong><p><input id="frameInput" type="file" accept="image/*"></p>
<small>ফ্রেমের PNG-তে ছবির জায়গাটা স্বচ্ছ (transparent) থাকা প্রয়োজন।</small>
</section>
<section class="panel">
<canvas id="canvas" width="1080" height="1080"></canvas>
<p><strong>ছবির জুম</strong><input id="zoom" type="range" min="0.5" max="3" value="1" step="0.01"></p>
<div class="actions"><button id="download">ছবি ডাউনলোড</button><button id="reset" class="secondary">রিসেট</button></div>
<p><small>ছবি টেনে সরিয়ে ঠিক করুন। ফ্রেম সবসময় উপরে থাকবে।</small></p>
</section>
</main>
<script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d'),photoInput=document.getElementById('photoInput'),frameInput=document.getElementById('frameInput'),zoom=document.getElementById('zoom');
let photo=null,frame=null,scale=1,x=0,y=0,base=1,drag=false,lastX=0,lastY=0;
function draw(){
 ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle="#e7ebef";ctx.fillRect(0,0,c.width,c.height);
 if(photo){let fit=Math.max(c.width/photo.width,c.height/photo.height);base=fit;let s=fit*scale,w=photo.width*s,h=photo.height*s;
 ctx.drawImage(photo,(c.width-w)/2+x,(c.height-h)/2+y,w,h);}
 if(frame)ctx.drawImage(frame,0,0,c.width,c.height);
}
function loadFile(file,cb){if(!file)return;let im=new Image(),url=URL.createObjectURL(file);im.onload=()=>{cb(im);URL.revokeObjectURL(url);draw()};im.src=url}
photoInput.onchange=e=>loadFile(e.target.files[0],im=>{photo=im;x=0;y=0;scale=1;zoom.value=1});
frameInput.onchange=e=>loadFile(e.target.files[0],im=>frame=im);
zoom.oninput=()=>{scale=Number(zoom.value);draw()};
function pos(e){let r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
c.addEventListener('pointerdown',e=>{drag=true;c.setPointerCapture(e.pointerId);let p=pos(e);lastX=p.x;lastY=p.y});
c.addEventListener('pointermove',e=>{if(!drag)return;let p=pos(e);x+=p.x-lastX;y+=p.y-lastY;lastX=p.x;lastY=p.y;draw()});
c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);
document.getElementById('download').onclick=()=>{if(!photo||!frame){alert('আগে ছবি এবং ফ্রেম নির্বাচন করুন।');return}let a=document.createElement('a');a.download='group-photo.png';a.href=c.toDataURL('image/png');a.click()};
document.getElementById('reset').onclick=()=>{photo=null;frame=null;x=0;y=0;scale=1;zoom.value=1;photoInput.value='';frameInput.value='';draw()};
draw();
</script></body></html>
